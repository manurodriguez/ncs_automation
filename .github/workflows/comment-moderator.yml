name: Comment Moderation Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Moderate Comment
        uses: actions/github-script@v8
        env:
          BANNED_WORDS_SECRET: ${{ secrets.BANNED_WORDS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const author = comment.user.login;
            const commentId = comment.id;
            const commentBody = comment.body.toLowerCase();

            // Fetch secret from environment and split into array
            const secretVal = process.env.BANNED_WORDS_SECRET || '';
            const BANNED_WORDS = secretVal.split(',').map(w => w.trim().toLowerCase()).filter(Boolean);

            const containsBannedWord = BANNED_WORDS.some(word => commentBody.includes(word));

            // Check account age
            const userResponse = await github.rest.users.getByUsername({ username: author });
            const accountCreated = new Date(userResponse.data.created_at);
            const accountAgeDays = (new Date() - accountCreated) / (1000 * 60 * 60 * 24);
            const IS_NEW_ACCOUNT = accountAgeDays < 3;

            if (containsBannedWord || IS_NEW_ACCOUNT) {

              console.log(`[DELETED COMMENT RECORD] User: ${author} | Content: ${commentBody}`);

              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId
              });
              console.log(`Deleted comment ID ${commentId} from user ${author}.`);
            }
